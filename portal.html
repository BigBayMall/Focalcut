<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal | FocalCut</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0A0A0A; --surface: #121212; --accent: #D4FF3D; --text: #FAFAFA; --muted: #A3A3A3; --border: #262626; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 24px; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0 0 16px 0; }
  .btn { background: var(--accent); color: #0A0A0A; padding: 12px 24px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; border: none; cursor: pointer; font-family: 'Inter'; }
  .btn:hover { background: #E5FF73; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .pkg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .pkg-card { background: #1A1A1A; border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .pkg-name { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .pkg-credits { font-family: 'Space Grotesk'; font-size: 36px; font-weight: 700; }
  .pkg-credits span { font-size: 16px; color: var(--muted); font-weight: 400; }
  .progress-bar { width: 100%; height: 6px; background: #262626; border-radius: 3px; margin-top: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); }
  .project-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); }
  .project-item:last-child { border-bottom: none; }
  .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-editing { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
  .status-review { background: rgba(59, 130, 246, 0.15); color: #3B82F6; }
  .status-approved { background: rgba(34, 197, 94, 0.15); color: #22C55E; }
  .eta-text { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .hidden { display: none; }
  .login-form { max-width: 400px; margin: 80px auto; text-align: center; }
  .login-form input { width: 100%; padding: 14px; margin-bottom: 16px; background: #1A1A1A; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Inter'; }
</style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
      <a href="index.html" style="font-family:'Space Grotesk'; font-size:24px; font-weight:700; color:var(--accent); text-decoration:none;">FOCALCUT</a>
      <button onclick="logout()" class="btn btn-ghost hidden" id="logoutBtn" style="font-size:13px; padding:8px 16px;">Logout</button>
    </div>

    <div id="loginView" class="login-form card">
      <h2>Client Portal</h2>
      <p style="color:var(--muted); margin-bottom:24px;">Access your dashboard using the link from your welcome email.</p>
      <input type="text" id="clientIdInput" placeholder="Client ID (e.g., FC-1234)">
      <input type="text" id="tokenInput" placeholder="Access Token">
      <button onclick="login()" class="btn" style="width:100%;">Access Dashboard</button>
      <p id="errorMsg" style="color:#EF4444; margin-top:16px; display:none;">Invalid credentials.</p>
    </div>

    <div id="dashboardView" class="hidden">
      <h1>Welcome back, <span id="clientName">Client</span> 👋</h1>
      <p style="color:var(--muted); margin-bottom:32px;">Manage your packages and submit new footage below.</p>

      <div class="pkg-grid" id="pkgGrid"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;">Active Projects</h2>
        <a href="submit.html" id="submitBtn" class="btn">+ Submit New Footage</a>
      </div>
      
      <div class="card" id="projectsList"></div>
    </div>
  </div>

  <script>
    // REPLACE WITH YOUR APPS SCRIPT WEB APP URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbzE6iO5bhMklzklFHFnW_HXmhLem4XHMELHbLmlxMuTuUSWuKAfdkkm4Q5OM-fHEnPXDA/exec';
    const urlParams = new URLSearchParams(window.location.search);
    
    if (urlParams.get('cid') && urlParams.get('token')) {
      document.getElementById('clientIdInput').value = urlParams.get('cid');
      document.getElementById('tokenInput').value = urlParams.get('token');
      login();
    }

    function login() {
      const cid = document.getElementById('clientIdInput').value.trim();
      const token = document.getElementById('tokenInput').value.trim();
      
      fetch(`${API_URL}?action=getPortalData&clientId=${cid}&token=${token}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) { document.getElementById('errorMsg').style.display = 'block'; return; }
          
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('dashboardView').classList.remove('hidden');
          document.getElementById('logoutBtn').classList.remove('hidden');
          document.getElementById('clientName').innerText = data.name;
          document.getElementById('submitBtn').href = `submit.html?cid=${cid}&token=${token}`;

          // Render Packages
          const pkgGrid = document.getElementById('pkgGrid');
          pkgGrid.innerHTML = '';
          let activePkgId = '';
          data.packages.forEach(pkg => {
            if (pkg.status === 'Active') activePkgId = pkg.pkgId;
            const remaining = pkg.total - pkg.used;
            const pct = (pkg.used / pkg.total) * 100;
            pkgGrid.innerHTML += `
              <div class="pkg-card">
                <div class="pkg-name">${pkg.name}</div>
                <div class="pkg-credits">${remaining} <span>/ ${pkg.total} remaining</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
              </div>`;
          });

          // Render Projects
          const projList = document.getElementById('projectsList');
          projList.innerHTML = '';
          if (data.projects.length === 0) {
            projList.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px;">No active projects. Submit your first footage!</p>';
          } else {
            data.projects.forEach(p => {
              let badgeClass = 'status-editing';
              if (p.status.includes('Review')) badgeClass = 'status-review';
              if (p.status.includes('Approved')) badgeClass = 'status-approved';
              
              let action = `<span class="status-badge ${badgeClass}">${p.status}</span>`;
              if (p.status === 'Ready for Review' && p.deliveryLink) {
                action = `<a href="${p.deliveryLink}" target="_blank" class="btn" style="font-size:12px; padding:8px 16px;">Watch Video</a>`;
              }
              
              const etaDate = new Date(p.eta);
              const etaString = etaDate.toLocaleString('en-US', { timeZone: 'America/New_York', dateStyle: 'medium', timeStyle: 'short' });
              
              projList.innerHTML += `
                <div class="project-item">
                  <div>
                    <div style="font-weight:600; font-size:16px;">${p.title}</div>
                    <div class="eta-text">Estimated Delivery: ${etaString} (EST)</div>
                  </div>
                  ${action}
                </div>`;
            });
          }
        });
    }
    function logout() { window.location.href = 'portal.html'; }
  </script>
</body>
</html>
